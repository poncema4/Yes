[package]
name = "rust_packet_sniffer"
version = "0.1.0"
edition = "2021"
authors = ["Marco Ponce"]
description = "Advanced Rust Packet Sniffer with TUI Dashboard"

[dependencies]
pnet = "0.34"
pnet_datalink = "0.34"
tokio = { version = "=1.38.0", features = ["full"] }
clap = { version = "=4.4.18", features = ["derive"] }
ratatui = "=0.26.3"
crossterm = "=0.27.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ahash = "0.8"
colored = "2"
parking_lot = "0.12"
anyhow = "1"

[[bin]]
name = "sniffer"
path = "src/main.rs"
